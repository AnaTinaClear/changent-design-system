name: Design system checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run build
      - name: Generated files are committed
        run: git diff --exit-code -- dist powerbi || (echo "::error::Run 'npm run build' and commit dist/ and powerbi/" && exit 1)
      - run: npm test
